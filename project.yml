name: HospitalTycoon
options:
  bundleIdPrefix: com.hospitaltycoon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"

targets:
  HospitalTycoon:
    type: application
    platform: iOS
    sources:
      - HospitalTycoon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hospitaltycoon.app
        INFOPLIST_KEY_CFBundleDisplayName: "Hospital Tycoon"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - HospitalTycoonTests

  HospitalTycoonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HospitalTycoonTests
    dependencies:
      - target: HospitalTycoon
